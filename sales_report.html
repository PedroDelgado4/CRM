
    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>CRM Detailed Sales Report</title>
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
        <style>
            body { 
                background-color: #050505; 
                color: white; 
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
                padding: 40px; 
                margin: 0;
            }
            h1 { 
                color: #DEFF9A; 
                text-align: center; 
                margin-bottom: 40px; 
                font-size: 32px; 
                text-transform: uppercase; 
                letter-spacing: 2px; 
            }
            .metrics-container { 
                display: flex; 
                justify-content: space-around; 
                margin-bottom: 50px; 
                max-width: 1000px;
                margin-left: auto;
                margin-right: auto;
            }
            .metric-card { 
                background-color: #151515; 
                border: 1px solid #333; 
                border-radius: 12px; 
                padding: 25px; 
                width: 30%; 
                text-align: center; 
                box-shadow: 0 4px 6px rgba(0,0,0,0.3); 
            }
            .metric-title { 
                color: #D9D9D9; 
                font-size: 14px; 
                margin-bottom: 10px; 
                text-transform: uppercase; 
                letter-spacing: 1px;
            }
            .metric-value { 
                color: #DEFF9A; 
                font-size: 32px; 
                font-weight: bold; 
            }
            .chart-container { 
                background-color: #151515; 
                border: 1px solid #333; 
                border-radius: 12px; 
                padding: 30px; 
                margin: 0 auto; 
                max-width: 940px; 
                box-shadow: 0 4px 6px rgba(0,0,0,0.3); 
            }
        </style>
    </head>
    <body>
        <h1>SALES PERFORMANCE REPORT</h1>
        
        <div class="metrics-container">
            <div class="metric-card">
                <div class="metric-title">Total Revenue</div>
                <div class="metric-value">114.98 €</div>
            </div>
            <div class="metric-card">
                <div class="metric-title">Total Sales (Units)</div>
                <div class="metric-value">4</div>
            </div>
            <div class="metric-card">
                <div class="metric-title">Average Sale Value</div>
                <div class="metric-value">28.75 €</div>
            </div>
        </div>

        <div class="chart-container">
            <canvas id="salesChart"></canvas>
        </div>

        <script>
            const ctx = document.getElementById('salesChart').getContext('2d');
            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['Servicio 1', 'Curso 1', 'Curso 2', 'Servicio 2'],
                    datasets: [{
                        label: 'Revenue by Product (€)',
                        data: [9.99, 20.0, 35.0, 49.99],
                        backgroundColor: '#DEFF9A',
                        borderColor: '#050505',
                        borderWidth: 2,
                        borderRadius: 4
                    }]
                },
                options: {
                    responsive: true,
                    scales: {
                        y: {
                            beginAtZero: true,
                            grid: { color: '#333' },
                            ticks: { color: '#D9D9D9', font: { size: 14 } }
                        },
                        x: {
                            grid: { display: false },
                            ticks: { color: '#D9D9D9', font: { size: 14 } }
                        }
                    },
                    plugins: {
                        legend: {
                            labels: { color: 'white', font: { size: 16 } }
                        },
                        tooltip: {
                            backgroundColor: '#050505',
                            titleColor: '#DEFF9A',
                            bodyColor: 'white',
                            borderColor: '#333',
                            borderWidth: 1
                        }
                    }
                }
            });
        </script>
    </body>
    </html>
